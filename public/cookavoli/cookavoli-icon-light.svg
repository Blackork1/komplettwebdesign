  <g filter="url(#panel-shadow)">
    <rect x="29" y="25" width="966" height="974" rx="190" fill="url(#background)" stroke="#e7ebe9" stroke-width="6"/>
    <rect x="39" y="35" width="946" height="954" rx="180" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="4"/>
  </g>

  <g filter="url(#mark-shadow)">
    <path id="letter-c" fill="url(#letter-c-gradient)" d="M510 355 460 448c-30-15-63-24-96-24-85 0-134 65-134 165 0 102 56 170 142 170 49 0 94-15 135-43l53 87c-52 40-116 63-189 63-146 0-241-108-241-276 0-159 102-254 246-254 49 0 95 7 134 19Z"/>
    <path id="letter-a" fill="url(#letter-a-gradient)" d="M521 413 790 870H676L517 605l-68 101H331Z"/>
  </g>

