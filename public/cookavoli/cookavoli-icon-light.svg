    <path id="small-leaf" fill="url(#small-leaf)" d="M386 188c78 13 125 67 123 157-78-7-125-66-123-157Z"/>
    <path fill="url(#small-leaf-shade)" d="M397 201c49 29 83 70 104 128-26-44-59-78-104-128Z"/>

