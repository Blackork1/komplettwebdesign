<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Cookavoli App-Icon</title>
  <desc id="description">Dunkelgrünes Cookavoli-Monogramm mit zwei leuchtend grünen Blättern auf weißem Hintergrund.</desc>
  <defs>
    <linearGradient id="background" x1="512" y1="24" x2="512" y2="998" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#fefefe"/>
      <stop offset="1" stop-color="#f5f7f6"/>
    </linearGradient>
    <radialGradient id="letter-c-gradient" cx="0" cy="0" r="1" gradientTransform="translate(399 328) rotate(124) scale(546 504)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07873a"/>
      <stop offset=".48" stop-color="#00502c"/>
      <stop offset="1" stop-color="#002d1d"/>
    </radialGradient>
    <linearGradient id="letter-a-gradient" x1="478" y1="430" x2="661" y2="864" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#087938"/>
      <stop offset=".5" stop-color="#00602f"/>
      <stop offset="1" stop-color="#003d27"/>
    </linearGradient>
    <linearGradient id="small-leaf" x1="397" y1="197" x2="505" y2="343" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#91ff18"/>
      <stop offset=".42" stop-color="#42dc20"/>
      <stop offset="1" stop-color="#00924a"/>
    </linearGradient>
    <linearGradient id="small-leaf-shade" x1="402" y1="205" x2="500" y2="337" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9ff50" stop-opacity=".72"/>
      <stop offset=".52" stop-color="#7df027" stop-opacity=".16"/>
      <stop offset="1" stop-color="#006d3c" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="large-leaf" x1="616" y1="126" x2="708" y2="441" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c3fb58"/>
      <stop offset=".38" stop-color="#6cdd1b"/>
      <stop offset=".7" stop-color="#1db92b"/>
      <stop offset="1" stop-color="#00742f"/>
    </linearGradient>
    <linearGradient id="large-leaf-light" x1="650" y1="132" x2="704" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#efff83" stop-opacity=".92"/>
      <stop offset=".48" stop-color="#b9ff41" stop-opacity=".62"/>
      <stop offset="1" stop-color="#72e92a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="large-leaf-shade" x1="620" y1="284" x2="734" y2="434" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20c735" stop-opacity="0"/>
      <stop offset="1" stop-color="#006b2f" stop-opacity=".95"/>
    </linearGradient>
    <filter id="panel-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#7c8b83" flood-opacity=".13"/>
    </filter>
    <filter id="mark-shadow" x="-15%" y="-15%" width="130%" height="140%">
