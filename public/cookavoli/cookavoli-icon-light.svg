    <path fill="url(#large-leaf-light)" d="M584 342c27-92 106-188 229-239-75 58-114 111-147 171-24 45-48 75-77 94-4-9-6-17-5-26Z"/>
    <path fill="url(#large-leaf-shade)" d="M579 456c57-10 115-39 160-83 30-29 55-65 75-106-18 80-60 137-108 170-43 29-88 40-127 44Z" opacity=".94"/>
    <path fill="#006b39" d="M554 431c37-94 86-158 165-215-67 70-110 141-142 236Z"/>
    <path fill="#ffffff" d="M569 425c35-78 76-134 133-183-48 58-84 120-112 188-5 11-9 19-13 24Z"/>
  </g>
</svg>
