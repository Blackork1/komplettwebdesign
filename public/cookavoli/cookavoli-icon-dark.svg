      <stop offset="1" stop-color="#00994d"/>
    </linearGradient>
    <linearGradient id="small-leaf-shade" x1="402" y1="205" x2="500" y2="337" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d5ff5b" stop-opacity=".75"/>
      <stop offset=".52" stop-color="#83f42b" stop-opacity=".18"/>
      <stop offset="1" stop-color="#00713f" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="large-leaf" x1="616" y1="126" x2="708" y2="441" gradientUnits="userSpaceOnUse">
