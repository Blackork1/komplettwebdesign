<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Cookavoli App-Icon</title>
  <desc id="description">Weißes Cookavoli-Monogramm mit zwei leuchtend grünen Blättern auf tiefgrünem Hintergrund.</desc>
  <defs>
    <radialGradient id="background" cx="0" cy="0" r="1" gradientTransform="translate(443 257) rotate(56) scale(780 737)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06422b"/>
      <stop offset=".48" stop-color="#00311f"/>
      <stop offset="1" stop-color="#001c13"/>
    </radialGradient>
    <linearGradient id="frame" x1="141" y1="42" x2="865" y2="1005" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13885c"/>
      <stop offset=".22" stop-color="#006545"/>
      <stop offset=".65" stop-color="#003c2f"/>
      <stop offset="1" stop-color="#001e19"/>
    </linearGradient>
    <linearGradient id="small-leaf" x1="397" y1="197" x2="505" y2="343" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a0ff1d"/>
