    <linearGradient id="large-leaf-light" x1="650" y1="132" x2="704" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3ff92" stop-opacity=".96"/>
      <stop offset=".48" stop-color="#c0ff49" stop-opacity=".66"/>
      <stop offset="1" stop-color="#76ed2c" stop-opacity="0"/>
