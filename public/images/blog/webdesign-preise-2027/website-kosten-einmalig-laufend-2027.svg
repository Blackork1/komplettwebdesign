<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Website-Kosten: einmalig und laufend</title><desc id="desc">Zwei Spalten unterscheiden die einmalige Erstellung und laufende Betriebskosten. Leistungen können gebündelt sein.</desc><rect width="1200" height="900" fill="#f6f2ec"/><g font-family="Arial, sans-serif"><text x="50" y="73" font-size="21" font-weight="700" fill="#b73510">DEIN WEBSITE-BUDGET 2027</text><text x="50" y="135" font-size="43" font-weight="700" fill="#0b2a46">Einmal erstellen. Laufend betreiben.</text><text x="50" y="181" font-size="24" font-weight="400" fill="#526170">Beide Kostenarten gehören von Anfang an in deine Planung.</text><rect x="50" y="220" width="520" height="505" rx="24" fill="white"/><rect x="50" y="220" width="520" height="10" rx="5" fill="#c93c0c"/><text x="80" y="286" font-size="32" font-weight="700" fill="#0b2a46">Einmalige Erstellung</text><text x="80" y="327" font-size="22" font-weight="400" fill="#526170">Der vereinbarte Projektumfang</text><circle cx="88" cy="380" r="5" fill="#c93c0c"/><text x="110" y="389" font-size="24" font-weight="400" fill="#0b2a46">Konzept und Seitenstruktur</text><circle cx="88" cy="445" r="5" fill="#c93c0c"/><text x="110" y="454" font-size="24" font-weight="400" fill="#0b2a46">Design für alle Bildschirmgrößen</text><circle cx="88" cy="510" r="5" fill="#c93c0c"/><text x="110" y="519" font-size="24" font-weight="400" fill="#0b2a46">Texte und Bildbearbeitung¹</text><circle cx="88" cy="575" r="5" fill="#c93c0c"/><text x="110" y="584" font-size="24" font-weight="400" fill="#0b2a46">Programmierung und Tests</text><circle cx="88" cy="640" r="5" fill="#c93c0c"/><text x="110" y="649" font-size="24" font-weight="400" fill="#0b2a46">SEO-Grundlagen und Start</text><rect x="630" y="220" width="520" height="505" rx="24" fill="white"/><rect x="630" y="220" width="520" height="10" rx="5" fill="#0b2a46"/><text x="660" y="286" font-size="32" font-weight="700" fill="#0b2a46">Laufender Betrieb</text><text x="660" y="327" font-size="22" font-weight="400" fill="#526170">Monatlich, jährlich oder nach Nutzung</text><circle cx="668" cy="380" r="5" fill="#0b2a46"/><text x="690" y="389" font-size="24" font-weight="400" fill="#0b2a46">Hosting und Domain</text><circle cx="668" cy="445" r="5" fill="#0b2a46"/><text x="690" y="454" font-size="24" font-weight="400" fill="#0b2a46">E-Mail-Postfächer</text><circle cx="668" cy="510" r="5" fill="#0b2a46"/><text x="690" y="519" font-size="24" font-weight="400" fill="#0b2a46">Wartung nach Vereinbarung</text><circle cx="668" cy="575" r="5" fill="#0b2a46"/><text x="690" y="584" font-size="24" font-weight="400" fill="#0b2a46">Tools und Lizenzen</text><circle cx="668" cy="640" r="5" fill="#0b2a46"/><text x="690" y="649" font-size="24" font-weight="400" fill="#0b2a46">Gebühren bei Shop und Buchung</text><text x="50" y="779" font-size="21" font-weight="400" fill="#526170">¹ Umfang nach Angebot. Neue Texte, Fotos und Sonderfunktionen separat klären.</text><text x="50" y="819" font-size="21" font-weight="400" fill="#526170">Enthaltene Leistungen nicht doppelt berechnen. Hosting ist nicht automatisch Wartung.</text><text x="50" y="868" font-size="19" font-weight="700" fill="#0b2a46">KOMPLETT WEBDESIGN  ·  BERLIN</text></g></svg>
