<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Website-Budget über drei Jahre</title><desc id="desc">Beispielrechnung: Start 1.375 Euro, Business mit Wartung Basis 3.479 Euro, Wachstum mit Wartung Standard 5.919 Euro. Keine Komplettangebote; Zusatzleistungen sind nicht enthalten.</desc><rect width="1200" height="900" fill="#f6f2ec"/><g font-family="Arial, sans-serif"><text x="55" y="72" font-size="21" font-weight="700" fill="#b73510">BUDGETPLANUNG 2027</text><text x="55" y="135" font-size="43" font-weight="700" fill="#0b2a46">Was kostet die Website über drei Jahre?</text><rect x="55" y="181" width="20" height="20" fill="#0b2a46"/><text x="87" y="199" font-size="22" font-weight="400" fill="#0b2a46">Einmalige Erstellung</text><rect x="380" y="181" width="20" height="20" fill="#c93c0c"/><text x="412" y="199" font-size="22" font-weight="400" fill="#0b2a46">36 Monate Betrieb, ggf. mit Wartung</text><text x="55" y="265" font-size="26" font-weight="700" fill="#0b2a46">Kompakter Start</text><rect x="55" y="290" width="93.42153846153846" height="46" fill="#0b2a46"/><rect x="148.42153846153846" y="290" width="67.3476923076923" height="46" fill="#c93c0c"/><text x="235.76923076923077" y="324" font-size="29" font-weight="700" fill="#0b2a46">1.375 €</text><text x="55" y="372" font-size="22" font-weight="400" fill="#526170">799 € Erstellung + 36 × 16 € Betrieb</text><text x="55" y="425" font-size="26" font-weight="700" fill="#0b2a46">Business mit Wartung Basis</text><rect x="55" y="450" width="175.2676923076923" height="46" fill="#0b2a46"/><rect x="230.2676923076923" y="450" width="231.5076923076923" height="46" fill="#c93c0c"/><text x="481.7753846153846" y="484" font-size="29" font-weight="700" fill="#0b2a46">3.479 €</text><text x="55" y="532" font-size="22" font-weight="400" fill="#526170">1.499 € Erstellung + 36 × 55 € Betrieb</text><text x="55" y="585" font-size="26" font-weight="700" fill="#0b2a46">Wachstum mit Wartung Standard</text><rect x="55" y="610" width="292.1907692307692" height="46" fill="#0b2a46"/><rect x="347.1907692307692" y="610" width="399.8769230769231" height="46" fill="#c93c0c"/><text x="767.0676923076924" y="644" font-size="29" font-weight="700" fill="#0b2a46">5.919 €</text><text x="55" y="692" font-size="22" font-weight="400" fill="#526170">2.499 € Erstellung + 36 × 95 € Betrieb</text><text x="55" y="775" font-size="22" font-weight="400" fill="#526170">Rechenannahme: Hosting 10 € + Domain/E-Mail 6 € pro Monat.</text><text x="55" y="808" font-size="22" font-weight="400" fill="#526170">Wartung Basis 39 €, Standard 79 € pro Monat; beim Start nicht eingerechnet.</text><text x="55" y="841" font-size="22" font-weight="400" fill="#526170">Ohne Extras und Preisänderungen. Keine verbindlichen Komplettangebote.</text><text x="55" y="880" font-size="18" font-weight="700" fill="#0b2a46">KOMPLETT WEBDESIGN  ·  PREISSTAND NOVEMBER 2026</text></g></svg>
